<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduGenie - AI Learning Companion</title>
    <link rel="stylesheet" href="/static/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <header class="header">
        <div class="header-container">
            <div class="logo">
                <h1>EduGenie</h1>
                <p>Your AI-powered learning companion</p>
            </div>
            <button id="theme-toggle" class="theme-toggle" aria-label="Toggle dark mode">
                <svg id="moon-icon" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
                <svg id="sun-icon" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none;"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
            </button>
        </div>
    </header>

    <main class="main-container">
        <section class="hero-section">
            <h2>Learn smarter. Understand faster.</h2>
            <p>Select a task below to begin your learning journey.</p>
        </section>

        <section class="workspace">
            <div class="task-selector-wrapper">
                <select id="task-selector" class="task-selector" aria-label="Select a task">
                    <option value="explain">Explain a Concept</option>
                    <option value="qa">Ask a Question</option>
                    <option value="quiz">Generate Quiz</option>
                    <option value="summarize">Summarize Text</option>
                    <option value="learning_path">Create Learning Path</option>
                </select>
            </div>

            <div class="input-area">
                <textarea id="user-input" placeholder="Enter a concept you want explained simply..." aria-label="Input area"></textarea>
                <div class="action-buttons">
                    <button id="clear-btn" class="btn btn-secondary">Clear</button>
                    <button id="submit-btn" class="btn btn-primary">Generate</button>
                </div>
            </div>

            <div id="loading-state" class="loading-state" style="display: none;">
                <div class="spinner"></div>
                <p>EduGenie is thinking...</p>
            </div>
            <div id="error-state" class="error-state" style="display: none;"></div>

            <div id="result-area" class="result-area" style="display: none;">
                <div class="result-header">
                    <h3 id="result-title">Result</h3>
                    <button id="copy-btn" class="btn btn-icon" title="Copy to clipboard">
                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
                    </button>
                </div>
                <div id="result-content" class="result-content"></div>
            </div>
        </section>
    </main>
    
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="/static/script.js"></script>
</body>
</html>
